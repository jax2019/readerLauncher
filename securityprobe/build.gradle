plugins { id 'com.android.application' }
android {
    namespace 'com.ireaderlauncher.probe'
    compileSdk 35
    defaultConfig { applicationId 'com.ireaderlauncher.probe'; minSdk 28; targetSdk 34; versionCode 1; versionName '0.1.0' }
    buildFeatures { aidl true }
    sourceSets.main.aidl.srcDirs += '../shared/aidl'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
